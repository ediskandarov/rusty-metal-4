name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Install locked workspace dependencies
        run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build:rustymetal4.com
      - run: bun run test:rooms
      - name: Check room browsers without game files
        run: TM4_CHROME="$(command -v google-chrome)" bun run test:rooms:browser

  build:
    needs: checks
    env:
      CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/build/network-wasm
    # Forks never receive the private game deploy key.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read pinned game revision
        id: game
        run: echo "revision=$(git ls-tree HEAD game | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - name: Check out private game sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ediskandarov/tm4_archaeology
          ref: ${{ steps.game.outputs.revision }}
          path: game
          ssh-key: ${{ secrets.GAME_DEPLOY_KEY }}
          persist-credentials: false
      - name: Check out pinned PsyZ and SDL
        run: |
          git submodule update --init --depth 1 external/psyz
          git -C external/psyz submodule update --init --depth 1 external/SDL
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Install locked workspace dependencies
        run: bun install --frozen-lockfile
      - name: Check out Emscripten SDK
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: emscripten-core/emsdk
          ref: 35659964bc2762fffec0d257997fb61475f765b7 # 6.0.13
          path: .emsdk
          persist-credentials: false
      - name: Install Emscripten
        run: |
          .emsdk/emsdk install 6.0.13
          .emsdk/emsdk activate 6.0.13
      - name: Set up pinned Rust toolchain
        run: bun tools/ci/setup-rust.ts
      - name: Cache browser Rust dependencies and tools
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: network -> ../build/network-wasm
          key: browser-ubuntu-24.04-${{ hashFiles('tools/network/build.ts') }}
          cache-directories: build/rust-tools
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build release
        run: |
          source .emsdk/emsdk_env.sh
          bun run build
      - name: Upload shared server bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-bundle
          path: build/release/server
          if-no-files-found: error
          retention-days: 7
      - name: Check static hosting without disc files
        # The runner already includes Chrome and its system dependencies.
        run: |
          chrome="$(command -v google-chrome)"
          "$chrome" --version
          TM4_CHROME="$chrome" bun run test:pages

  server:
    needs: build
    env:
      CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/build/network-native
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Set up pinned Rust toolchain
        run: bun tools/ci/setup-rust.ts
      - name: Cache native Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: network -> ../build/network-native
          key: native-${{ matrix.runner }}-${{ matrix.platform }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-bundle
          path: build/release/server
      - name: Build standalone server for tests
        working-directory: network
        env:
          TM4_SERVER_BUNDLE: ${{ github.workspace }}/build/release/server
        run: cargo build --locked --release --bin tm4-deathmatch-server --features embedded-server --target-dir ../build/network-native
      - name: Test embedded simulation and API
        working-directory: network
        env:
          TM4_SERVER_BUNDLE: ${{ github.workspace }}/build/release/server
        run: cargo test --locked --release --lib --bin tm4-deathmatch-server --features embedded-server --target-dir ../build/network-native
      - name: Run copied standalone binary
        env:
          TM4_SERVER_EXECUTABLE: build/network-native/release/tm4-deathmatch-server
        run: bun run test:server:standalone
