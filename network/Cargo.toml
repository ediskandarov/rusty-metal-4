[package]
name = "tm4-deathmatch-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
name = "tm4_network"
crate-type = ["cdylib", "rlib"]

[features]
default = ["server"]
server = ["lightyear/server", "dep:wasmtime", "dep:wasmtime-wasi", "dep:anyhow", "dep:sha2", "dep:base64", "dep:ctrlc", "dep:axum", "dep:tokio", "dep:tower", "dep:tower-http"]
client = ["lightyear/client"]
rollback_probe = []
embedded-server = ["server", "dep:include_dir", "dep:mime_guess", "dep:http-range-header"]

[[bin]]
name = "tm4-deathmatch-server"
path = "src/main.rs"
required-features = ["server"]

[[example]]
name = "rollback_peer"
required-features = ["server", "rollback_probe"]

[dependencies]
aeronet_io = "0.21"
bevy_app = "0.19"
bevy_ecs = "0.19"
lightyear = { version = "=0.30.1", default-features = false, features = ["std", "websocket", "raw_connection", "input_native", "replication", "prediction", "interpolation"] }
bevy_reflect = "0.19"
bevy_time = "0.19"
bevy_tasks = "0.19"
bevy_state = "0.19"
bevy_log = "0.19"
wasm-bindgen = "=0.2.114"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
getrandom = "0.4"
include_dir = { version = "0.7.4", optional = true }
mime_guess = { version = "2.0.5", optional = true }
http-range-header = { version = "0.4.2", optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "fs", "sync", "macros"], optional = true }
tower = { version = "0.5", features = ["util", "limit"], optional = true }
tower-http = { version = "0.7", features = ["fs"], optional = true }
ctrlc = { version = "3.5", features = ["termination"], optional = true }
anyhow = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
wasmtime = { version = "=47.0.1", default-features = false, features = ["cranelift", "runtime", "std", "anyhow"], optional = true }
wasmtime-wasi = { version = "=47.0.1", default-features = false, features = ["p1"], optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = "0.1"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = "symbols"
